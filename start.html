<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Link in bio example | Dally Tampus</title>
<meta name="description" content="An example link-in-bio page by Dally Tampus: visitors pick their path and leave the details you need to follow up.">
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link id="gf" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;1,9..144,300;1,9..144,400&family=Figtree:wght@400;500;600&display=swap">
<style>
:root{--paper:#F7F2EB;--stone:#EEE7DE;--ink:#211417;--muted:#75666A;--wine:#7A2337;--merlot:#3A1220;--sand:#CBB79A;--display:"Fraunces",Georgia,serif;--sans:"Figtree",-apple-system,BlinkMacSystemFont,sans-serif}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--lpbg,var(--paper));color:var(--ink);font:400 16px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
a{color:inherit}
.demo{background:var(--ink);color:#fff;font-size:12.5px;text-align:center;padding:9px 16px;line-height:1.4}
.demo a{color:var(--sand);white-space:nowrap}
.page{max-width:520px;margin:0 auto;min-height:100svh;background:var(--lpbg,var(--paper))}
.hero{background:linear-gradient(160deg,var(--lpd,var(--merlot)) 30%,var(--lpd2,var(--wine)));color:#fff;padding:36px 22px 26px;display:flex;flex-direction:column;gap:10px}
.logo img{height:40px;width:auto}
.eye{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;opacity:.8}
h1{font-family:var(--display);font-weight:400;font-size:34px;line-height:1.05;margin:4px 0;letter-spacing:-.01em}
.sub{opacity:.85;font-size:15.5px}
.chips{display:flex;flex-wrap:wrap;gap:8px;border-top:1px solid rgba(255,255,255,.2);padding-top:14px;margin-top:6px}
.chips span{border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.07);border-radius:99px;padding:5px 12px;font-size:13px}
.body{padding:22px 16px 40px;display:flex;flex-direction:column;gap:12px}
.ask{font-weight:600;font-size:18px;margin:4px 4px 2px}
.path{display:flex;align-items:center;gap:14px;background:#fff;border:1px solid color-mix(in srgb,var(--ink) 9%,transparent);border-radius:18px;padding:16px;text-align:left;width:100%;font:inherit;color:inherit;cursor:pointer;box-shadow:0 8px 20px -16px rgba(0,0,0,.35);transition:transform .25s}
.path:hover{transform:translateY(-2px)}
.path.first{box-shadow:inset 0 3px 0 var(--lpa,var(--sand)),0 8px 20px -16px rgba(0,0,0,.35)}
.ic{flex:none;width:46px;height:46px;border-radius:14px;background:linear-gradient(160deg,var(--lpd,var(--merlot)),var(--lpd2,var(--wine)));color:#fff;display:grid;place-items:center}
.ic svg{width:22px;height:22px}
.path div{flex:1;display:flex;flex-direction:column;gap:2px}
.path b{font-size:17px;font-weight:600}
.path small{font-size:13.5px;color:var(--muted);line-height:1.35}
.badge{align-self:flex-start;background:color-mix(in srgb,var(--lpa,var(--sand)) 45%,#fff);color:var(--lpd,var(--merlot));font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;border-radius:6px;padding:3px 8px;margin-bottom:3px}
.path i{font-style:normal;color:var(--wine);font-size:22px}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.btns a{text-align:center;padding:14px;border-radius:14px;font-weight:600;text-decoration:none;background:var(--lpd,var(--merlot));color:#fff}
.btns a+a{background:#fff;color:var(--lpd,var(--merlot));border:1px solid color-mix(in srgb,var(--ink) 15%,transparent)}
.contact{text-align:center;color:var(--muted);font-size:13px}
.back{background:none;border:0;color:#fff;font:inherit;font-size:14px;padding:0;cursor:pointer;opacity:.85;align-self:flex-start}
form{background:#fff;border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:12px;box-shadow:0 12px 30px -22px rgba(0,0,0,.4)}
label{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:500}
input{font:inherit;font-size:16px;padding:12px 14px;border-radius:12px;border:1px solid color-mix(in srgb,var(--ink) 18%,transparent);background:var(--paper)}
form button{margin-top:4px;padding:15px;border:0;border-radius:14px;background:var(--lpd,var(--merlot));color:#fff;font:inherit;font-weight:600;font-size:16px;cursor:pointer}
.note{font-size:12.5px;color:var(--muted);text-align:center}
.done{background:#fff;border-radius:20px;padding:26px 20px;text-align:center;box-shadow:0 12px 30px -22px rgba(0,0,0,.4)}
.done h2{font-family:var(--display);font-weight:400;font-size:28px;margin:0 0 8px}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="content.js"></script>
</head>
<body>
<div class="demo">Example link-in-bio page by Dally Tampus. Your version uses your name, photo, links and colors. <a href="/#work">Back to the portfolio</a></div>
<div class="page" id="page"></div>
<script src="start.js"></script>
</body>
</html>
